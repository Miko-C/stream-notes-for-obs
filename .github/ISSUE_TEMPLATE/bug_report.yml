name: 不具合報告
description: 再現できる不具合を報告します
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 配信前の原稿、個人情報、APIキーを貼り付けないでください。
  - type: input
    id: version
    attributes:
      label: 配信ノートのバージョン
      placeholder: 例 1.0.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 利用環境
      placeholder: Windows 11 / OBS Studio 32.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: 問題が起きるまでの操作を順番に記載してください。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待した動作
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
    validations:
      required: true
